{% extends "base.html" %}
{% block title %}Użytkownicy{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-parkrun-dark mb-1">Użytkownicy</h1>
<p class="text-gray-500 text-sm mb-6">Nadawaj role Koordynatora lub Admina.</p>

<div class="bg-white border border-gray-100 rounded-2xl overflow-x-auto">
    <table class="w-full text-left">
        <thead>
            <tr class="bg-gray-50 text-xs font-semibold text-gray-500 uppercase tracking-wide">
                <th class="p-3">Użytkownik</th>
                <th class="p-3">Kod parkrun</th>
                <th class="p-3">Rola</th>
                <th class="p-3 text-right">Zmień rolę</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
                {% include "admin/_user_row.html" %}
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
