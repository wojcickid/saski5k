{% extends "base.html" %}
{% block title %}Użytkownicy{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-parkrun-dark mb-1">Użytkownicy</h1>
<p class="text-gray-500 text-sm mb-6">Nadawaj role, edytuj dane, resetuj hasła, blokuj lub usuwaj konta.</p>

<div class="bg-white border border-gray-100 rounded-2xl overflow-hidden divide-y divide-gray-100">
    {% for user in users %}
        {% include "admin/_user_row.html" %}
    {% else %}
    <div class="p-8 text-center text-gray-400 text-sm">Brak użytkowników.</div>
    {% endfor %}
</div>
{% endblock %}
