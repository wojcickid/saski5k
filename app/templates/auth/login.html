{% extends "base.html" %}
{% block title %}Logowanie{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-8 bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
    <h1 class="text-xl font-bold text-parkrun-dark mb-1">Zaloguj się</h1>
    <p class="text-sm text-gray-500 mb-6">{{ event_name }}</p>

    <form method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1">E-mail</label>
            <input type="email" name="email" required autofocus
                   class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-parkrun-green">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Hasło</label>
            <input type="password" name="password" required
                   class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-parkrun-green">
        </div>
        <button type="submit"
                class="w-full bg-parkrun-green text-white font-semibold py-2.5 rounded-lg hover:bg-parkrun-dark transition">
            Zaloguj się
        </button>
    </form>

    <p class="text-sm text-gray-500 mt-5 text-center">
        Nie masz konta?
        <a href="{{ url_for('auth.register') }}" class="text-parkrun-green font-medium hover:underline">Zarejestruj się</a>
    </p>
</div>
{% endblock %}
