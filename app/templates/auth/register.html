{% extends "base.html" %}
{% block title %}Rejestracja{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-8 bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
    <h1 class="text-xl font-bold text-parkrun-dark mb-1">Załóż konto wolontariusza</h1>
    <p class="text-sm text-gray-500 mb-6">{{ event_name }}</p>

    <form method="post" class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-sm font-medium mb-1">Imię</label>
                <input type="text" name="first_name" required value="{{ form.get('first_name', '') }}"
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-parkrun-green">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Nazwisko</label>
                <input type="text" name="last_name" required value="{{ form.get('last_name', '') }}"
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-parkrun-green">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Adres e-mail</label>
            <input type="email" name="email" required value="{{ form.get('email', '') }}"
                   class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-parkrun-green">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Kod Uczestnika parkrun</label>
            <input type="text" name="parkrun_id" required placeholder="np. A1234567" pattern="^[Aa]\d{6,8}$"
                   value="{{ form.get('parkrun_id', '') }}"
                   class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-parkrun-green">
            <p class="text-xs text-gray-400 mt-1">Format: litera A + 6-8 cyfr, np. A1234567.</p>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-sm font-medium mb-1">Hasło</label>
                <input type="password" name="password" required minlength="6"
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-parkrun-green">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Powtórz hasło</label>
                <input type="password" name="password2" required minlength="6"
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-parkrun-green">
            </div>
        </div>
        <button type="submit"
                class="w-full bg-parkrun-green text-white font-semibold py-2.5 rounded-lg hover:bg-parkrun-dark transition">
            Zarejestruj się
        </button>
    </form>

    <p class="text-sm text-gray-500 mt-5 text-center">
        Masz już konto?
        <a href="{{ url_for('auth.login') }}" class="text-parkrun-green font-medium hover:underline">Zaloguj się</a>
    </p>
</div>
{% endblock %}
